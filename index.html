<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リベット挿し依頼</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:sans-serif;
    max-width:500px;
    margin:auto;
    padding:20px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#28a745;
    color:white;
    border:none;
    border-radius:5px;
}

.info{
    background:#f5f5f5;
    padding:10px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<h2>リベット挿し依頼</h2>

<input id="partNumber" placeholder="品番">

<div class="info">
品名：<span id="partName">---</span>
</div>

<input id="quantity" type="number" placeholder="数量">

<input id="requester" placeholder="依頼者">

<button onclick="saveRequest()">登録</button>

<script>

const SUPABASE_URL =
'https://syenkcmxnwrfuazuaona.supabase.co';

const SUPABASE_KEY =
'sb_publishable_ERHnwKz2S2zHXeO2LpSIIg_XO36cGq';

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

document
.getElementById('partNumber')
.addEventListener('change', searchPart);

async function searchPart(){

    const partNumber =
    document.getElementById('partNumber').value;

    const { data } = await supabase
    .from('part_master')
    .select('*')
    .eq('part_number', partNumber)
    .limit(1);

    if(data && data.length > 0){

        document.getElementById('partName').innerText =
        data[0].part_name;

    }else{

        document.getElementById('partName').innerText =
        '見つかりません';

    }

}

async function saveRequest(){

    const partNumber =
    document.getElementById('partNumber').value;

    const partName =
    document.getElementById('partName').innerText;

    const quantity =
    Number(document.getElementById('quantity').value);

    const requester =
    document.getElementById('requester').value;

    const { error } =
    await supabase
    .from('rivet_requests')
    .insert([{
        request_date:
        new Date().toISOString().split('T')[0],
        part_number: partNumber,
        part_name: partName,
        requester: requester,
        quantity: quantity,
        status: '依頼中'
    }]);

    if(error){

        alert('登録エラー');

    }else{

        alert('登録完了');

    }

}

</script>

</body>
</html>
